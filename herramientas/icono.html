<!doctype html>
<!-- Plantilla del ícono para celular (180x180). Se exporta con:
     msedge --headless=new --screenshot=icono.png --window-size=180,180 --hide-scrollbars herramientas/icono.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{ margin:0; width:180px; height:180px; overflow:hidden; }
  body{ display:grid; place-items:center; background:#1E2A22; }
  svg{ width:118px; height:118px; color:#C97B49; }
</style>
</head>
<body>
  <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6"/>
    <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6" transform="rotate(120 60 60)"/>
    <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6" transform="rotate(240 60 60)"/>
  </svg>
</body>
</html>
