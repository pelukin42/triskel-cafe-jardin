<!doctype html>
<!-- Plantilla de la imagen para compartir (1200x630). Se exporta con:
     msedge --headless=new --screenshot=og.png --window-size=1200,630 --hide-scrollbars herramientas/og.html
     y se convierte a premium/img/og.jpg.
     Hoy no hay foto del negocio: el panel derecho usa un degradé de marca.
     Reemplazar por una foto real del jardín en cuanto Triskel la envíe. -->
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; width:1200px; height:630px; overflow:hidden; }
  body{ display:grid; grid-template-columns:560px 640px; font-family:"Jost", "Segoe UI", sans-serif; background:#1E2A22; color:#F5F3EA; }
  .txt{ position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 56px; background:
    radial-gradient(90% 70% at 0% 100%, rgba(62,114,102,.55), transparent 70%), #1E2A22; }
  .txt svg{ width:110px; height:110px; color:#C97B49; margin-bottom:18px; }
  .marca{ font-family:"Fraunces", Georgia, serif; font-size:76px; font-weight:500; letter-spacing:.1em; line-height:1; margin:0; }
  .sub{ font-size:16px; letter-spacing:.24em; text-transform:uppercase; color:#E6B78C; margin:14px 0 34px; }
  .lema{ font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:36px; line-height:1.25; margin:0 0 26px; }
  .lugar{ font-size:20px; color:#C9CFC5; margin:0; }
  .foto{ position:relative; background:
    radial-gradient(120% 90% at 100% 0%, rgba(201,123,73,.35), transparent 60%),
    linear-gradient(155deg, #24352B 0%, #2C4235 55%, #3E7266 100%); }
  .foto::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, #1E2A22 0%, rgba(30,42,34,0) 22%); }
</style>
</head>
<body>
  <div class="txt">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6"/>
      <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6" transform="rotate(120 60 60)"/>
      <path d="M60 60C60 39 73 26 90 30c13 3 16 19 5 26-8 5-18 2-21-6" transform="rotate(240 60 60)"/>
    </svg>
    <p class="marca">TRISKEL</p>
    <p class="sub">Café y Jardín</p>
    <p class="lema">Un jardín y buena comida</p>
    <p class="lugar">Brunch · Café de especialidad · Santa Elena, San Isidro de Heredia</p>
  </div>
  <div class="foto"></div>
</body>
</html>
